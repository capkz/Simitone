name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ios-port-scaffold]
    paths:
      - "Client/Simitone/Simitone.iOS/**"
      - "Client/Simitone/Simitone.Client/**"
      - "Client/Simitone/Simitone.Desktop/**"
      - "Client/Simitone/Simitone.Shared/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build-simulator:
    name: Build (Simulator, unsigned - compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Diagnostic: the previous run failed with "This version of .NET for
      # iOS (26.5.9004) requires Xcode 26.5. The current version of Xcode is
      # 26.6." - i.e. the installed iOS workload pack doesn't match whatever
      # Xcode xcode-select currently points at. This lists what's actually
      # on the runner so the next fix (pin Xcode via xcode-select, or pin a
      # different workload pack version) is based on real data, not a guess.
      - name: List available Xcode versions
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version || true
          xcode-select -p || true

      # Best-effort: try to select an Xcode version matching the iOS
      # workload pack error above. continue-on-error so that even if this
      # specific version isn't present on the runner, the workflow still
      # reaches the real build step and reports its actual current error
      # rather than stopping here uninformatively.
      - name: Select Xcode 26.5 if available
        continue-on-error: true
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install .NET iOS workload
        run: dotnet workload install ios

      # Three flag-only attempts against Simitone.iOS.csproj's own build
      # (--self-contained removal, PublishAot=false, explicit
      # -p:SelfContained=false) each produced the byte-identical NETSDK1203
      # failure on every FSO.* ProjectReference, confirming this isn't
      # fixable from flags: dotnet build with a mobile RID evaluates every
      # ProjectReference as part of that RID's build graph and rejects
      # plain-net9.0 projects outright. Fix is structural instead -
      # Simitone.iOS.csproj now references pre-built DLLs (HintPath) rather
      # than ProjectReference, so build those first as ordinary net9.0
      # assemblies, matching what FreeSO's old FSO.iOS.csproj actually did.
      # -r osx-arm64 (a normal desktop RID, unrelated to the mobile-RID
      # NETSDK1203 issue elsewhere in this file) is required here: Eto.Forms'
      # Mac backend (Eto.Platform.Mac64, pulled in by Simitone.Desktop.csproj
      # on macOS) fails its own build target with "No RuntimeIdentifiers or
      # MacRuntimeIdentifiers have been specified" without one - confirmed by
      # a real CI failure switching from Simitone.Client to Simitone.Desktop.
      # -p:NoWarn=NU1605: Desktop's own csproj already suppresses this
      # (package downgrade) restore warning, but with -r osx-arm64 the
      # transitively-referenced FSO.Server.* projects hit it too - they
      # don't carry the same suppression, and it escalates to a hard error
      # by default. Passing it as a global property applies it uniformly
      # across the whole graph regardless of which project declares it.
      # -m:1: without it, MSBuild's default parallel project build hit a
      # real race - two build nodes wrote FSO.Server.Api.Core's static web
      # assets cache file at once ("cannot access file... used by another
      # process"). That project is an unrelated ASP.NET Core server API
      # pulled in transitively, needed for nothing here except incidentally
      # producing a DLL alongside the client assemblies this step is
      # actually for - forcing serial builds is simpler than trying to
      # exclude it from the graph.
      - name: Build shared libraries (net9.0, osx-arm64)
        run: >
          dotnet build Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj
          -c Debug
          -f net9.0
          -r osx-arm64
          -p:AppendRuntimeIdentifierToOutputPath=false
          -p:NoWarn=NU1605
          -m:1

      # No signing needed for a simulator build - this alone answers the
      # question "does Simitone.iOS actually compile", which is the thing
      # that could not be checked anywhere except a real Mac.
      - name: Build for iOS Simulator
        run: >
          dotnet build Client/Simitone/Simitone.iOS/Simitone.iOS.csproj
          -c Debug
          -f net9.0-ios
          -r iossimulator-arm64

  build-device:
    name: Build (device, unsigned - for AltStore sideloading)
    runs-on: macos-latest
    needs: build-simulator
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same Xcode/workload version mismatch applies here as in
      # build-simulator - see that job's comments for why this exists.
      - name: Select Xcode 26.5 if available
        continue-on-error: true
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install .NET iOS workload
        run: dotnet workload install ios

      # -r osx-arm64 (a normal desktop RID, unrelated to the mobile-RID
      # NETSDK1203 issue elsewhere in this file) is required here: Eto.Forms'
      # Mac backend (Eto.Platform.Mac64, pulled in by Simitone.Desktop.csproj
      # on macOS) fails its own build target with "No RuntimeIdentifiers or
      # MacRuntimeIdentifiers have been specified" without one - confirmed by
      # a real CI failure switching from Simitone.Client to Simitone.Desktop.
      # -p:NoWarn=NU1605: Desktop's own csproj already suppresses this
      # (package downgrade) restore warning, but with -r osx-arm64 the
      # transitively-referenced FSO.Server.* projects hit it too - they
      # don't carry the same suppression, and it escalates to a hard error
      # by default. Passing it as a global property applies it uniformly
      # across the whole graph regardless of which project declares it.
      # -m:1: without it, MSBuild's default parallel project build hit a
      # real race - two build nodes wrote FSO.Server.Api.Core's static web
      # assets cache file at once ("cannot access file... used by another
      # process"). That project is an unrelated ASP.NET Core server API
      # pulled in transitively, needed for nothing here except incidentally
      # producing a DLL alongside the client assemblies this step is
      # actually for - forcing serial builds is simpler than trying to
      # exclude it from the graph.
      - name: Build shared libraries (net9.0, osx-arm64)
        run: >
          dotnet build Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj
          -c Debug
          -f net9.0
          -r osx-arm64
          -p:AppendRuntimeIdentifierToOutputPath=false
          -p:NoWarn=NU1605
          -m:1

      # No Apple certificate/provisioning profile at all: AltServer (not
      # Xcode, not the paid-only developer.apple.com certificates portal)
      # resigns the IPA locally using a free Apple ID at install time - that
      # already-established sideloading path doesn't need this CI pipeline
      # to produce a signed artifact, only a structurally valid one.
      # UNVERIFIED: whether the Apple iOS SDK's ArchiveOnBuild target
      # actually produces a valid .app/.ipa with zero CodesignKey specified,
      # or whether it hard-requires some signing identity even for an
      # archive meant to be fully re-signed later - this is exactly what
      # this run is testing.
      - name: Build and archive unsigned IPA
        run: >
          dotnet build Client/Simitone/Simitone.iOS/Simitone.iOS.csproj
          -c Release
          -f net9.0-ios
          -r ios-arm64
          -p:ArchiveOnBuild=true
          -p:CodesignKey=

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Simitone-iOS
          path: Client/Simitone/Simitone.iOS/bin/Release/net9.0-ios/ios-arm64/**/*.ipa
          if-no-files-found: error
