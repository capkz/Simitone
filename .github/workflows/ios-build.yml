name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [ios-port-scaffold]
    paths:
      - "Client/Simitone/Simitone.iOS/**"
      - "Client/Simitone/Simitone.Client/**"
      - "Client/Simitone/Simitone.Desktop/**"
      - "Client/Simitone/Simitone.Shared/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build-simulator:
    name: Build (Simulator, unsigned - compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Diagnostic: the previous run failed with "This version of .NET for
      # iOS (26.5.9004) requires Xcode 26.5. The current version of Xcode is
      # 26.6." - i.e. the installed iOS workload pack doesn't match whatever
      # Xcode xcode-select currently points at. This lists what's actually
      # on the runner so the next fix (pin Xcode via xcode-select, or pin a
      # different workload pack version) is based on real data, not a guess.
      - name: List available Xcode versions
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version || true
          xcode-select -p || true

      # Best-effort: try to select an Xcode version matching the iOS
      # workload pack error above. continue-on-error so that even if this
      # specific version isn't present on the runner, the workflow still
      # reaches the real build step and reports its actual current error
      # rather than stopping here uninformatively.
      - name: Select Xcode 26.5 if available
        continue-on-error: true
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install .NET iOS workload
        run: dotnet workload install ios

      # Three flag-only attempts against Simitone.iOS.csproj's own build
      # (--self-contained removal, PublishAot=false, explicit
      # -p:SelfContained=false) each produced the byte-identical NETSDK1203
      # failure on every FSO.* ProjectReference, confirming this isn't
      # fixable from flags: dotnet build with a mobile RID evaluates every
      # ProjectReference as part of that RID's build graph and rejects
      # plain-net9.0 projects outright. Fix is structural instead -
      # Simitone.iOS.csproj now references pre-built DLLs (HintPath) rather
      # than ProjectReference, so build those first as ordinary net9.0
      # assemblies, matching what FreeSO's old FSO.iOS.csproj actually did.
      # -r osx-arm64 (a normal desktop RID, unrelated to the mobile-RID
      # NETSDK1203 issue elsewhere in this file) is required here: Eto.Forms'
      # Mac backend (Eto.Platform.Mac64, pulled in by Simitone.Desktop.csproj
      # on macOS) fails its own build target with "No RuntimeIdentifiers or
      # MacRuntimeIdentifiers have been specified" without one - confirmed by
      # a real CI failure switching from Simitone.Client to Simitone.Desktop.
      # -p:NoWarn=NU1605: Desktop's own csproj already suppresses this
      # (package downgrade) restore warning, but with -r osx-arm64 the
      # transitively-referenced FSO.Server.* projects hit it too - they
      # don't carry the same suppression, and it escalates to a hard error
      # by default. Passing it as a global property applies it uniformly
      # across the whole graph regardless of which project declares it.
      # -m:1: without it, MSBuild's default parallel project build hit a
      # real race - two build nodes wrote FSO.Server.Api.Core's static web
      # assets cache file at once ("cannot access file... used by another
      # process"). That project is an unrelated ASP.NET Core server API
      # pulled in transitively, needed for nothing here except incidentally
      # producing a DLL alongside the client assemblies this step is
      # actually for - forcing serial builds is simpler than trying to
      # exclude it from the graph.
      - name: Build shared libraries (net9.0, osx-arm64)
        run: >
          dotnet build Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj
          -c Debug
          -f net9.0
          -r osx-arm64
          -p:AppendRuntimeIdentifierToOutputPath=false
          -p:NoWarn=NU1605
          -m:1

      # No signing needed for a simulator build - this alone answers the
      # question "does Simitone.iOS actually compile", which is the thing
      # that could not be checked anywhere except a real Mac.
      - name: Build for iOS Simulator
        run: >
          dotnet build Client/Simitone/Simitone.iOS/Simitone.iOS.csproj
          -c Debug
          -f net9.0-ios
          -r iossimulator-arm64

  # EXPERIMENT: does the codesigning requirement come from ArchiveOnBuild's
  # own packaging step specifically, or from any device-RID (ios-arm64)
  # build at all? build-device's "Build, sign, and archive IPA" step only
  # tested the ArchiveOnBuild path. If a plain (non-archived) build produces
  # an unsigned .app with no signing identity required at all, that .app can
  # be zipped into a Payload/*.app IPA by hand, entirely sidestepping Apple's
  # signing requirement in CI - no Apple ID needed anywhere in this
  # pipeline, only at install/resign time via AltServer (or AltServer-Linux,
  # which needs no Mac either - see docs/ios-device-signing.md). This job is
  # independent of build-device and always runs so the answer shows up on
  # every push regardless of whether APPLE_TEAM_ID is configured.
  build-device-unsigned-experiment:
    name: "EXPERIMENT: plain device build without ArchiveOnBuild"
    runs-on: macos-latest
    needs: build-simulator
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26.5 if available
        continue-on-error: true
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install .NET iOS workload
        run: dotnet workload install ios

      - name: Build shared libraries (net9.0, osx-arm64)
        run: >
          dotnet build Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj
          -c Debug
          -f net9.0
          -r osx-arm64
          -p:AppendRuntimeIdentifierToOutputPath=false
          -p:NoWarn=NU1605
          -m:1

      # Deliberately no -p:ArchiveOnBuild=true here - just an ordinary build
      # targeting the device RID, to see whether the codesign requirement is
      # specific to archive packaging or applies to any ios-arm64 build.
      - name: Build for device (no archive, no signing property at all)
        run: >
          dotnet build Client/Simitone/Simitone.iOS/Simitone.iOS.csproj
          -c Release
          -f net9.0-ios
          -r ios-arm64

      - name: Locate .app bundle and hand-package an IPA
        if: success()
        run: |
          set -euo pipefail
          APP_DIR=$(find Client/Simitone/Simitone.iOS/bin/Release/net9.0-ios/ios-arm64 -maxdepth 2 -name "*.app" -type d | head -n1)
          if [ -z "$APP_DIR" ]; then
            echo "No .app bundle found - build likely produced something else or failed silently."
            find Client/Simitone/Simitone.iOS/bin/Release/net9.0-ios/ios-arm64 -maxdepth 3 || true
            exit 1
          fi
          echo "Found: $APP_DIR"
          codesign -dv "$APP_DIR" 2>&1 || echo "(not signed, or codesign couldn't inspect it - expected if the build truly skipped signing)"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_DIR" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -r -q Simitone-unsigned.ipa Payload)
          mkdir -p unsigned-ipa-out
          mv "$RUNNER_TEMP/Simitone-unsigned.ipa" unsigned-ipa-out/

      - name: Upload unsigned IPA (experimental)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Simitone-iOS-unsigned-experiment
          path: unsigned-ipa-out/Simitone-unsigned.ipa
          if-no-files-found: warn

  # EXPERIMENT 2: build-device-unsigned-experiment confirmed the codesign
  # check is not specific to ArchiveOnBuild - a plain ios-arm64 build hits
  # the identical "No valid iOS code signing keys found in keychain" error
  # (same Xamarin.Shared.targets:1994,3). That error fires because
  # `security find-identity -v -p codesigning` finds literally zero
  # identities on a stock runner. Untested: whether it just needs *some*
  # codesigning identity present (any name, self-issued, no Apple
  # involvement at all - AltServer/AltServer-Linux fully replaces this
  # signature at install time anyway, so it never needs to be genuine), or
  # whether downstream steps (provisioning profile matching, entitlements
  # validation) require something only Apple can issue. A self-signed cert
  # is trivial to generate with openssl - no Apple ID, no Xcode, no
  # network call to Apple at all.
  build-device-selfsigned-experiment:
    name: "EXPERIMENT: self-signed cert, no Apple ID involved"
    runs-on: macos-latest
    needs: build-simulator
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26.5 if available
        continue-on-error: true
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install .NET iOS workload
        run: dotnet workload install ios

      - name: Build shared libraries (net9.0, osx-arm64)
        run: >
          dotnet build Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj
          -c Debug
          -f net9.0
          -r osx-arm64
          -p:AppendRuntimeIdentifierToOutputPath=false
          -p:NoWarn=NU1605
          -m:1

      - name: Generate a self-signed codesigning identity (no Apple involved)
        run: |
          set -euo pipefail
          CERT_CN="Apple Development: CI Experiment (0000000000)"
          echo "CERT_CN=$CERT_CN" >> "$GITHUB_ENV"

          openssl req -x509 -newkey rsa:2048 -keyout "$RUNNER_TEMP/key.pem" \
            -out "$RUNNER_TEMP/cert.pem" -days 365 -nodes \
            -subj "/CN=$CERT_CN" -addext "extendedKeyUsage=codeSigning"
          openssl pkcs12 -export -out "$RUNNER_TEMP/selfsigned.p12" \
            -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
            -passout pass:temporary

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/selfsigned.p12" -k "$KEYCHAIN_PATH" \
            -P temporary -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[" ]//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          echo "--- find-identity output ---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true

      - name: Build for device using the self-signed identity
        run: >
          dotnet build Client/Simitone/Simitone.iOS/Simitone.iOS.csproj
          -c Release
          -f net9.0-ios
          -r ios-arm64
          -p:CodesignKey="${{ env.CERT_CN }}"

  build-device:
    name: Build & sign (device - installable via sideloading)
    runs-on: macos-latest
    needs: build-simulator
    # Skipped entirely until Apple signing secrets/vars are configured - see
    # docs/ios-device-signing.md in sims-1-ios-port for what to set up and why.
    if: ${{ vars.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Same Xcode/workload version mismatch applies here as in
      # build-simulator - see that job's comments for why this exists.
      - name: Select Xcode 26.5 if available
        continue-on-error: true
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install .NET iOS workload
        run: dotnet workload install ios

      # -r osx-arm64 (a normal desktop RID, unrelated to the mobile-RID
      # NETSDK1203 issue elsewhere in this file) is required here: Eto.Forms'
      # Mac backend (Eto.Platform.Mac64, pulled in by Simitone.Desktop.csproj
      # on macOS) fails its own build target with "No RuntimeIdentifiers or
      # MacRuntimeIdentifiers have been specified" without one - confirmed by
      # a real CI failure switching from Simitone.Client to Simitone.Desktop.
      # -p:NoWarn=NU1605: Desktop's own csproj already suppresses this
      # (package downgrade) restore warning, but with -r osx-arm64 the
      # transitively-referenced FSO.Server.* projects hit it too - they
      # don't carry the same suppression, and it escalates to a hard error
      # by default. Passing it as a global property applies it uniformly
      # across the whole graph regardless of which project declares it.
      # -m:1: without it, MSBuild's default parallel project build hit a
      # real race - two build nodes wrote FSO.Server.Api.Core's static web
      # assets cache file at once ("cannot access file... used by another
      # process"). That project is an unrelated ASP.NET Core server API
      # pulled in transitively, needed for nothing here except incidentally
      # producing a DLL alongside the client assemblies this step is
      # actually for - forcing serial builds is simpler than trying to
      # exclude it from the graph.
      - name: Build shared libraries (net9.0, osx-arm64)
        run: >
          dotnet build Client/Simitone/Simitone.Desktop/Simitone.Desktop.csproj
          -c Debug
          -f net9.0
          -r osx-arm64
          -p:AppendRuntimeIdentifierToOutputPath=false
          -p:NoWarn=NU1605
          -m:1

      # CONFIRMED on real CI (run 31597660985): -p:ArchiveOnBuild=true with
      # -p:CodesignKey= (empty) fails hard - "No valid iOS code signing keys
      # found in keychain. You need to request a codesigning certificate from
      # https://developer.apple.com." (Xamarin.Shared.targets(1994,3)). The
      # theory that AltServer's install-time resigning would let CI skip
      # signing entirely was wrong: ArchiveOnBuild invokes Apple's own
      # archive-packaging step, which unconditionally requires a real
      # codesigning identity present in the keychain before it will produce
      # an .ipa at all - there's no flag to bypass this, only whether the
      # identity is a free-tier "Apple Development" cert or a paid one.
      # That identity does NOT require a paid Developer Program account: a
      # free Apple ID's Xcode "Personal Team" can generate an "Apple
      # Development" certificate via Xcode's own Accounts UI (Manage
      # Certificates), which is a separate, free-tier-accessible flow from
      # the developer.apple.com web portal (Certificates, Identifiers &
      # Profiles) that requires paid enrollment - see
      # docs/ios-device-signing.md for the exact steps.
      - name: Import signing certificate and provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed 's/[" ]//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | \
            plutil -extract UUID xml1 -o - - | \
            sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp "$RUNNER_TEMP/profile.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Build, sign, and archive IPA
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: >
          dotnet build Client/Simitone/Simitone.iOS/Simitone.iOS.csproj
          -c Release
          -f net9.0-ios
          -r ios-arm64
          -p:ArchiveOnBuild=true
          -p:CodesignKey="Apple Development"
          -p:CodesignProvision="${{ env.PROFILE_UUID }}"
          -p:CodesignTeamId="${{ env.APPLE_TEAM_ID }}"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Simitone-iOS
          path: Client/Simitone/Simitone.iOS/bin/Release/net9.0-ios/ios-arm64/**/*.ipa
          if-no-files-found: error
